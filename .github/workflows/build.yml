name: Nokia XG-040G UBI Cloud Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: "选择 Nokia XG-040G 型号"
        required: true
        type: choice
        default: mf
        options:
          - mf
          - md

      hostname:
        description: "路由器名称"
        required: true
        type: string
        default: "OpenWrt"

      lan_ip:
        description: "后台管理地址"
        required: true
        type: string
        default: "192.168.6.1"

      argon:
        description: "集成 Argon 主题（默认开启）"
        required: true
        type: boolean
        default: true

      passwall:
        description: "集成 PassWall（含核心）"
        required: true
        type: boolean
        default: true

      openclash:
        description: "集成 OpenClash（Meta 核心）"
        required: true
        type: boolean
        default: true

      lucky:
        description: "集成 Lucky"
        required: true
        type: boolean
        default: true

      usb:
        description: "USB 2.0 / 3.0 + 自动挂载"
        required: true
        type: boolean
        default: true

      tailscale:
        description: "集成 Tailscale"
        required: true
        type: boolean
        default: true

      extra_packages:
        description: "额外软件包，空格分隔，例如 tcpdump htop"
        required: false
        type: string
        default: ""

      upload_release:
        description: "自动创建 GitHub Release"
        required: true
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build Nokia XG-040G-${{ inputs.device }}-UBI
    runs-on: ubuntu-24.04

    steps:
      # ==========================================================
      # 1. 清理磁盘空间
      # ==========================================================
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo apt-get clean
          df -h

      # ==========================================================
      # 2. 安装编译依赖
      # ==========================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            flex gawk gcc-multilib g++-multilib gettext git gperf haveged help2man \
            intltool libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz mkisofs nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig \
            texinfo unzip upx-ucl vim wget xmlto xxd zlib1g-dev

      # ==========================================================
      # 3. 克隆 LEDE
      # ==========================================================
      - name: Clone LEDE
        run: |
          git clone --depth=1 https://github.com/coolsnowwolf/lede.git lede
          cd lede
          echo "LEDE commit: $(git rev-parse HEAD)"

      # ==========================================================
      # 4. 验证设备是否存在
      # ==========================================================
      - name: Verify Nokia device profiles
        working-directory: lede
        run: |
          echo "=========================================="
          echo "Checking Nokia XG-040G device profiles"
          echo "=========================================="

          if [ "${{ inputs.device }}" = "md" ]; then
            if ! grep -R "nokia_xg-040g-md-ubi" target/linux/airoha >/dev/null 2>&1; then
              echo "ERROR: Nokia XG-040G-MD UBI profile not found."
              exit 1
            fi
            echo "Found: nokia_xg-040g-md-ubi"
          fi

          if [ "${{ inputs.device }}" = "mf" ]; then
            if ! grep -R "nokia_xg-040g-mf-ubi" target/linux/airoha >/dev/null 2>&1; then
              echo "ERROR: Nokia XG-040G-MF UBI profile not found."
              exit 1
            fi
            echo "Found: nokia_xg-040g-mf-ubi"
          fi

      # ==========================================================
      # 5. 添加 Argon 主题
      # ==========================================================
      - name: Add Argon theme
        if: inputs.argon == true
        working-directory: lede
        run: |
          mkdir -p package/argon
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/argon/luci-theme-argon
          echo "Argon theme added."

      # ==========================================================
      # 6. 添加 OpenClash
      # ==========================================================
      - name: Add OpenClash
        if: inputs.openclash == true
        working-directory: lede
        run: |
          mkdir -p package/openclash
          git clone --depth=1 https://github.com/vernesong/OpenClash.git /tmp/OpenClash
          cp -rf /tmp/OpenClash/luci-app-openclash package/openclash/
          rm -rf /tmp/OpenClash
          echo "OpenClash added."

      # ==========================================================
      # 7. 更新 feeds
      # ==========================================================
      - name: Update feeds
        working-directory: lede
        run: |
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================================
      # 8. 添加第三方软件包
      # ==========================================================
      - name: Add optional packages
        working-directory: lede
        run: |
          mkdir -p package/custom

          # PassWall 完整源码（含核心依赖）
          if [ "${{ inputs.passwall }}" = "true" ]; then
            git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall.git package/custom/passwall
            git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall-packages.git package/custom/passwall-packages
            echo "PassWall + packages added."
          fi

          # Lucky
          if [ "${{ inputs.lucky }}" = "true" ]; then
            git clone --depth=1 https://github.com/gdy666/luci-app-lucky.git package/custom/luci-app-lucky
            echo "Lucky added."
          fi

          # Tailscale（优先用 feeds，若没有再从第三方拉取）
          if [ "${{ inputs.tailscale }}" = "true" ]; then
            if ! find package feeds -type d -name "*tailscale*" 2>/dev/null | head -1 | grep -q .; then
              git clone --depth=1 https://github.com/immortalwrt/packages.git /tmp/immortal-packages || true
              if [ -d /tmp/immortal-packages/net/tailscale ]; then
                mkdir -p package/custom/tailscale
                cp -rf /tmp/immortal-packages/net/tailscale package/custom/
              fi
              rm -rf /tmp/immortal-packages
            fi
            echo "Tailscale source prepared."
          fi

      # ==========================================================
      # 9. 重新安装 feeds
      # ==========================================================
      - name: Install feeds
        working-directory: lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================================
      # 10. 生成设备配置
      # ==========================================================
      - name: Prepare device configuration
        working-directory: lede
        run: |
          mkdir -p build-config

          if [ "${{ inputs.device }}" = "mf" ]; then
            cat > build-config/device.config << 'EOF'
CONFIG_TARGET_airoha=y
CONFIG_TARGET_airoha_an7583=y
CONFIG_TARGET_MULTI_PROFILE=n
CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y
EOF
          fi

          if [ "${{ inputs.device }}" = "md" ]; then
            cat > build-config/device.config << 'EOF'
CONFIG_TARGET_airoha=y
CONFIG_TARGET_airoha_an7581=y
CONFIG_TARGET_MULTI_PROFILE=n
CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
EOF
          fi

          cat build-config/device.config

      # ==========================================================
      # 11. 创建基础 .config
      # ==========================================================
      - name: Create base configuration
        working-directory: lede
        run: |
          rm -f .config

          cat > .config << 'EOF'
#
# Target
#
CONFIG_TARGET_ROOTFS_SQUASHFS=y

#
# LuCI
#
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y

#
# Web server
#
CONFIG_PACKAGE_uhttpd=y
CONFIG_PACKAGE_uhttpd-mod-ubus=y

#
# Network tools
#
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_wget-ssl=y

#
# Certificates
#
CONFIG_PACKAGE_ca-bundle=y
CONFIG_PACKAGE_ca-certificates=y

#
# Firewall
#
CONFIG_PACKAGE_firewall4=y
CONFIG_PACKAGE_nftables=y

#
# IPv6
#
CONFIG_PACKAGE_ipv6helper=y

#
# Useful tools
#
CONFIG_PACKAGE_htop=y
CONFIG_PACKAGE_nano=y
CONFIG_PACKAGE_tcpdump=y

#
# Chinese language
#
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
CONFIG_PACKAGE_luci-i18n-system-zh-cn=y
CONFIG_PACKAGE_luci-i18n-network-zh-cn=y
EOF

          cat build-config/device.config >> .config

      # ==========================================================
      # 12. 配置可选插件
      # ==========================================================
      - name: Configure optional packages
        working-directory: lede
        run: |
          set -e
          CONFIG_FILE=".config"

          add_pkg() {
            PKG="$1"
            if grep -R -E "Package/[A-Za-z0-9_.+-]*${PKG}|PKGARCH.*${PKG}" package feeds >/dev/null 2>&1; then
              echo "CONFIG_PACKAGE_${PKG}=y" >> "$CONFIG_FILE"
              echo "[OK] ${PKG}"
            else
              echo "[SKIP] ${PKG} not found"
            fi
          }

          # Argon
          if [ "${{ inputs.argon }}" = "true" ]; then
            add_pkg "luci-theme-argon"
          fi

          # PassWall + 核心
          if [ "${{ inputs.passwall }}" = "true" ]; then
            add_pkg "luci-app-passwall"
            add_pkg "xray-core"
            add_pkg "sing-box"
            add_pkg "geoview"
            add_pkg "v2ray-geoip"
            add_pkg "v2ray-geosite"
          fi

          # OpenClash（Meta 核心）
          if [ "${{ inputs.openclash }}" = "true" ]; then
            add_pkg "luci-app-openclash"
            # Meta 核心会在后面下载脚本中处理
          fi

          # Lucky
          if [ "${{ inputs.lucky }}" = "true" ]; then
            add_pkg "luci-app-lucky"
          fi

          # USB 2.0 / 3.0 + 自动挂载
          if [ "${{ inputs.usb }}" = "true" ]; then
            add_pkg "kmod-usb-core"
            add_pkg "kmod-usb2"
            add_pkg "kmod-usb3"
            add_pkg "kmod-usb-storage"
            add_pkg "kmod-usb-storage-uas"
            add_pkg "kmod-usb-ledtrig-usbport"
            add_pkg "block-mount"
            add_pkg "blockd"
            add_pkg "mount-utils"
            add_pkg "kmod-fs-ext4"
            add_pkg "kmod-fs-vfat"
            add_pkg "kmod-fs-exfat"
            add_pkg "kmod-fs-ntfs"
            add_pkg "e2fsprogs"
            add_pkg "fdisk"
            add_pkg "lsblk"
            add_pkg "ntfs-3g"
            add_pkg "dosfstools"
          fi

          # Tailscale
          if [ "${{ inputs.tailscale }}" = "true" ]; then
            add_pkg "tailscale"
            add_pkg "luci-app-tailscale" || true
          fi

          # 额外软件包
          EXTRA="${{ inputs.extra_packages }}"
          if [ -n "$EXTRA" ]; then
            for PKG in $EXTRA; do
              add_pkg "$PKG"
            done
          fi

      # ==========================================================
      # 13. 设置默认主机名 + LAN IP + 网络接口
      # ==========================================================
      - name: Configure default router settings
        working-directory: lede
        run: |
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-custom-settings << EOF
#!/bin/sh

# 主机名
uci set system.@system[0].hostname='${{ inputs.hostname }}'

# LAN 地址
uci set network.lan.ipaddr='${{ inputs.lan_ip }}'
uci set network.lan.netmask='255.255.255.0'

# 强制设置网络接口：
# lan1 (2.5G) = WAN
# lan2 lan3 lan4 = LAN
# 兼容官方/Lean 已有 board.d 配置，若已正确则覆盖也无害

uci -q delete network.@device[0]
uci -q delete network.lan
uci -q delete network.wan
uci -q delete network.wan6

# 创建 br-lan（lan2 lan3 lan4）
uci add network device
uci set network.@device[-1].name='br-lan'
uci set network.@device[-1].type='bridge'
uci add_list network.@device[-1].ports='lan2'
uci add_list network.@device[-1].ports='lan3'
uci add_list network.@device[-1].ports='lan4'

# LAN 接口
uci set network.lan=interface
uci set network.lan.device='br-lan'
uci set network.lan.proto='static'
uci set network.lan.ipaddr='${{ inputs.lan_ip }}'
uci set network.lan.netmask='255.255.255.0'
uci set network.lan.ip6assign='60'

# WAN 接口（lan1 = 2.5G）
uci set network.wan=interface
uci set network.wan.device='lan1'
uci set network.wan.proto='dhcp'

uci set network.wan6=interface
uci set network.wan6.device='lan1'
uci set network.wan6.proto='dhcpv6'

uci commit system
uci commit network

exit 0
EOF

          chmod +x files/etc/uci-defaults/99-custom-settings

      # ==========================================================
      # 14. 设置 Argon 为默认主题
      # ==========================================================
      - name: Set Argon as default theme
        if: inputs.argon == true
        working-directory: lede
        run: |
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/98-argon-theme << 'EOF'
#!/bin/sh
if uci show luci >/dev/null 2>&1; then
  uci set luci.main.mediaurlbase='/luci-static/argon'
  uci commit luci
fi
exit 0
EOF

          chmod +x files/etc/uci-defaults/98-argon-theme

      # ==========================================================
      # 15. 下载 OpenClash Meta 核心（编译前预置）
      # ==========================================================
      - name: Prepare OpenClash Meta core
        if: inputs.openclash == true
        working-directory: lede
        run: |
          mkdir -p files/etc/openclash/core
          # 编译阶段不强制下载，启动后由 OpenClash 自己更新 Meta 核心更稳妥
          # 这里只预创建目录，避免首次运行报错
          echo "OpenClash core directory prepared."

      # ==========================================================
      # 16. 生成最终配置
      # ==========================================================
      - name: Generate final config
        working-directory: lede
        run: |
          make defconfig

      # ==========================================================
      # 17. 验证最终目标
      # ==========================================================
      - name: Verify final target
        working-directory: lede
        run: |
          echo "=========================================="
          echo "FINAL TARGET CONFIG"
          echo "=========================================="
          grep "^CONFIG_TARGET" .config || true

          echo
          echo "=========================================="
          echo "NOKIA DEVICE CONFIG"
          echo "=========================================="
          if [ "${{ inputs.device }}" = "mf" ]; then
            grep "nokia_xg-040g-mf-ubi" .config || true
          fi
          if [ "${{ inputs.device }}" = "md" ]; then
            grep "nokia_xg-040g-md-ubi" .config || true
          fi

      # ==========================================================
      # 18. 下载源码
      # ==========================================================
      - name: Download package sources
        working-directory: lede
        run: |
          make download -j$(nproc) V=s

      # ==========================================================
      # 19. 编译固件
      # ==========================================================
      - name: Build firmware
        working-directory: lede
        run: |
          echo "=========================================="
          echo "START BUILD"
          echo "=========================================="
          make -j$(nproc) V=s

      # ==========================================================
      # 20. 查找编译产物
      # ==========================================================
      - name: Find firmware
        working-directory: lede
        run: |
          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="
          find bin/targets -type f -maxdepth 5 -printf "%p\n" | sort

      # ==========================================================
      # 21. 整理 Release 文件
      # ==========================================================
      - name: Prepare release files
        working-directory: lede
        run: |
          rm -rf release
          mkdir -p release

          find bin/targets -type f \( \
            -name "*.itb" -o -name "*.bin" -o -name "*.img" \
            -o -name "*.ubi" -o -name "*.tar" -o -name "*.gz" \
            -o -name "*.fip" \
          \) -exec cp {} release/ \;

          cp .config release/config.buildinfo

          echo "Nokia XG-040G-${{ inputs.device }} UBI" > release/device.txt
          echo "${{ inputs.hostname }}" > release/hostname.txt
          echo "${{ inputs.lan_ip }}" > release/lan-ip.txt

          cd release
          sha256sum * > sha256sums.txt || true

          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="
          ls -lah

      # ==========================================================
      # 22. 上传 Artifact
      # ==========================================================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-${{ inputs.device }}-UBI
          path: lede/release/
          retention-days: 30

      # ==========================================================
      # 23. 生成 Release Tag
      # ==========================================================
      - name: Generate release tag
        if: inputs.upload_release == true
        id: release
        run: |
          TAG="nokia-xg040g-${{ inputs.device }}-ubi-$(date +'%Y%m%d-%H%M%S')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 24. 创建 GitHub Release
      # ==========================================================
      - name: Create GitHub Release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Nokia XG-040G-${{ inputs.device }} UBI
          body: |
            ## Nokia XG-040G-${{ inputs.device }} UBI

            ### 编译信息
            - 设备: Nokia XG-040G-${{ inputs.device }}
            - 分区方案: UBI
            - 主机名: ${{ inputs.hostname }}
            - 管理地址: ${{ inputs.lan_ip }}
            - 网络: lan1(2.5G)=WAN，lan2/3/4=LAN

            ### 默认插件
            - Argon 主题
            - PassWall（含核心）
            - OpenClash（Meta 核心）
            - Lucky
            - USB 2.0/3.0 + 自动挂载
            - Tailscale

            ### 使用说明
            1. 刷机请参考官方 OpenWrt 文档中的 UBI 安装方法
            2. 首次启动后请及时修改密码
            3. OpenClash Meta 核心建议在后台首次运行时自动下载
          files: |
            lede/release/*
