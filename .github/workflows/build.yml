name: Nokia XG-040G UBI Cloud Build

on:
  workflow_dispatch:
    inputs:

      device:
        description: "选择 Nokia XG-040G 型号"
        required: true
        type: choice
        default: mf
        options:
          - mf
          - md

      hostname:
        description: "路由器名称"
        required: true
        type: string
        default: "OpenWrt"

      lan_ip:
        description: "后台管理地址"
        required: true
        type: string
        default: "192.168.6.1"

      argon:
        description: "集成 Argon 主题"
        required: true
        type: boolean
        default: true

      passwall:
        description: "集成 PassWall"
        required: true
        type: boolean
        default: true

      xray:
        description: "集成 Xray"
        required: true
        type: boolean
        default: true

      singbox:
        description: "集成 sing-box"
        required: true
        type: boolean
        default: true

      openclash:
        description: "集成 OpenClash"
        required: true
        type: boolean
        default: true

      mihomo:
        description: "集成 Mihomo"
        required: true
        type: boolean
        default: true

      lucky:
        description: "集成 Lucky"
        required: true
        type: boolean
        default: true

      filemanager:
        description: "集成文件管理"
        required: true
        type: boolean
        default: true

      usb:
        description: "USB 2.0 / USB 3.0 / 自动挂载"
        required: true
        type: boolean
        default: true

      wireguard:
        description: "集成 WireGuard"
        required: true
        type: boolean
        default: false

      openvpn:
        description: "集成 OpenVPN"
        required: true
        type: boolean
        default: false

      extra_packages:
        description: "额外软件包，使用空格分隔，例如 tcpdump htop nano"
        required: false
        type: string
        default: ""

      upload_release:
        description: "自动创建 GitHub Release"
        required: true
        type: boolean
        default: true


env:
  TZ: Asia/Shanghai

jobs:

  build:

    name: Build Nokia XG-040G-${{ inputs.device }}-UBI

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. 清理 Runner 空间
      # ==========================================================

      - name: Free disk space
        run: |

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium

          sudo apt-get clean

          df -h


      # ==========================================================
      # 2. 安装编译依赖
      # ==========================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            mkisofs \
            nano \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            unzip \
            upx-ucl \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev


      # ==========================================================
      # 3. 下载 LEDE
      # ==========================================================

      - name: Clone LEDE
        run: |

          git clone \
            --depth=1 \
            https://github.com/coolsnowwolf/lede.git \
            lede

          cd lede

          echo "LEDE commit:"
          git rev-parse HEAD

          echo "LEDE branch:"
          git branch --show-current


      # ==========================================================
      # 4. 检查 Nokia 设备是否存在
      # ==========================================================

      - name: Verify Nokia device profiles
        working-directory: lede
        run: |

          echo "=========================================="
          echo "Checking Nokia XG-040G device profiles"
          echo "=========================================="

          echo
          echo "AN7581:"
          grep -R \
            "nokia_xg-040g-md-ubi" \
            target/linux/airoha \
            || true

          echo
          echo "AN7583:"
          grep -R \
            "nokia_xg-040g-mf-ubi" \
            target/linux/airoha \
            || true

          echo

          if [ "${{ inputs.device }}" = "md" ]; then

            if ! grep -R \
              "nokia_xg-040g-md-ubi" \
              target/linux/airoha >/dev/null 2>&1; then

              echo "ERROR:"
              echo "Nokia XG-040G-MD UBI profile was not found."
              exit 1

            fi

          fi

          if [ "${{ inputs.device }}" = "mf" ]; then

            if ! grep -R \
              "nokia_xg-040g-mf-ubi" \
              target/linux/airoha >/dev/null 2>&1; then

              echo "ERROR:"
              echo "Nokia XG-040G-MF UBI profile was not found."
              exit 1

            fi

          fi


      # ==========================================================
      # 5. 添加 Argon
      # ==========================================================

      - name: Add Argon theme
        if: inputs.argon == true
        working-directory: lede
        run: |

          mkdir -p package/argon

          git clone \
            --depth=1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/argon/luci-theme-argon

          echo "Argon added."


      # ==========================================================
      # 6. 添加 OpenClash
      # ==========================================================

      - name: Add OpenClash
        if: inputs.openclash == true
        working-directory: lede
        run: |

          mkdir -p package/openclash

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          cp -rf \
            /tmp/OpenClash/luci-app-openclash \
            package/openclash/

          rm -rf /tmp/OpenClash

          echo "OpenClash added."


      # ==========================================================
      # 7. 更新 LEDE feeds
      # ==========================================================

      - name: Update feeds
        working-directory: lede
        run: |

          ./scripts/feeds clean

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ==========================================================
      # 8. 添加第三方软件包源码
      # ==========================================================

      - name: Add optional packages
        working-directory: lede
        run: |

          mkdir -p package/custom


          # ------------------------------------------------------
          # PassWall
          # ------------------------------------------------------

          if [ "${{ inputs.passwall }}" = "true" ]; then

            git clone \
              --depth=1 \
              https://github.com/xiaorouji/openwrt-passwall.git \
              package/custom/passwall

          fi


          # ------------------------------------------------------
          # Lucky
          # ------------------------------------------------------

          if [ "${{ inputs.lucky }}" = "true" ]; then

            git clone \
              --depth=1 \
              https://github.com/gdy666/luci-app-lucky.git \
              package/custom/luci-app-lucky

          fi


          echo "Optional package source completed."


      # ==========================================================
      # 9. 重新安装 feeds
      # ==========================================================

      - name: Install feeds
        working-directory: lede
        run: |

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ==========================================================
      # 10. 找到设备配置
      # ==========================================================

      - name: Prepare device configuration
        working-directory: lede
        run: |

          mkdir -p build-config


          if [ "${{ inputs.device }}" = "mf" ]; then

            cat > build-config/device.config << 'EOF'

          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7583=y
          CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y

          EOF

          fi


          if [ "${{ inputs.device }}" = "md" ]; then

            cat > build-config/device.config << 'EOF'

          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y

          EOF

          fi


          cat build-config/device.config


      # ==========================================================
      # 11. 创建基础 .config
      # ==========================================================

      - name: Create base configuration
        working-directory: lede
        run: |

          rm -f .config

          cat > .config << 'EOF'

          #
          # Target
          #

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          #
          # LuCI
          #

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          #
          # Web server
          #

          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          #
          # Network
          #

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y

          #
          # Certificates
          #

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y

          #
          # Firewall
          #

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y

          #
          # IPv6
          #

          CONFIG_PACKAGE_ipv6helper=y

          #
          # Useful tools
          #

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_tcpdump=y

          #
          # Chinese
          #

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-system-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-network-zh-cn=y

          EOF


          cat build-config/device.config >> .config


      # ==========================================================
      # 12. 检查 package 是否存在的函数
      # ==========================================================

      - name: Configure optional packages
        working-directory: lede
        run: |

          set -e

          CONFIG_FILE=".config"


          add_pkg()
          {
            PKG="$1"

            if grep -R \
              -E \
              "Package/[A-Za-z0-9_.+-]*${PKG}|PKGARCH.*${PKG}" \
              package feeds \
              >/dev/null 2>&1; then

              echo "CONFIG_PACKAGE_${PKG}=y" >> "$CONFIG_FILE"

              echo "[OK] ${PKG}"

            else

              echo "[SKIP] ${PKG} not found"

            fi
          }


          # ======================================================
          # Argon
          # ======================================================

          if [ "${{ inputs.argon }}" = "true" ]; then

            add_pkg "luci-theme-argon"

          fi


          # ======================================================
          # PassWall
          # ======================================================

          if [ "${{ inputs.passwall }}" = "true" ]; then

            add_pkg "luci-app-passwall"

          fi


          # ======================================================
          # Xray
          # ======================================================

          if [ "${{ inputs.xray }}" = "true" ]; then

            add_pkg "xray-core"

          fi


          # ======================================================
          # sing-box
          # ======================================================

          if [ "${{ inputs.singbox }}" = "true" ]; then

            add_pkg "sing-box"

          fi


          # ======================================================
          # OpenClash
          # ======================================================

          if [ "${{ inputs.openclash }}" = "true" ]; then

            add_pkg "luci-app-openclash"

          fi


          # ======================================================
          # Mihomo
          # ======================================================

          if [ "${{ inputs.mihomo }}" = "true" ]; then

            add_pkg "mihomo"

          fi


          # ======================================================
          # Lucky
          # ======================================================

          if [ "${{ inputs.lucky }}" = "true" ]; then

            add_pkg "luci-app-lucky"

          fi


          # ======================================================
          # USB
          # ======================================================

          if [ "${{ inputs.usb }}" = "true" ]; then

            add_pkg "kmod-usb-core"
            add_pkg "kmod-usb2"
            add_pkg "kmod-usb3"

            add_pkg "kmod-usb-ledtrig-usbport"

            add_pkg "block-mount"
            add_pkg "mount-utils"

            add_pkg "kmod-fs-ext4"
            add_pkg "kmod-fs-vfat"
            add_pkg "kmod-fs-exfat"

            add_pkg "e2fsprogs"
            add_pkg "fdisk"
            add_pkg "lsblk"

          fi


          # ======================================================
          # WireGuard
          # ======================================================

          if [ "${{ inputs.wireguard }}" = "true" ]; then

            add_pkg "kmod-wireguard"
            add_pkg "wireguard-tools"
            add_pkg "luci-proto-wireguard"

          fi


          # ======================================================
          # OpenVPN
          # ======================================================

          if [ "${{ inputs.openvpn }}" = "true" ]; then

            add_pkg "openvpn-openssl"
            add_pkg "luci-app-openvpn"

          fi


          # ======================================================
          # Extra packages
          # ======================================================

          EXTRA="${{ inputs.extra_packages }}"

          if [ -n "$EXTRA" ]; then

            for PKG in $EXTRA; do

              add_pkg "$PKG"

            done

          fi


      # ==========================================================
      # 13. 设置默认路由器参数
      # ==========================================================

      - name: Configure default router settings
        working-directory: lede
        run: |

          mkdir -p files/etc/uci-defaults


          cat > files/etc/uci-defaults/99-custom-settings << 'EOF'
          #!/bin/sh

          #
          # Router hostname
          #

          uci set system.@system[0].hostname='${{ inputs.hostname }}'


          #
          # LAN address
          #

          uci set network.lan.ipaddr='${{ inputs.lan_ip }}'


          #
          # Commit
          #

          uci commit system
          uci commit network


          exit 0
          EOF


          chmod +x \
            files/etc/uci-defaults/99-custom-settings


      # ==========================================================
      # 14. 设置默认 Argon
      # ==========================================================

      - name: Set Argon as default theme
        if: inputs.argon == true
        working-directory: lede
        run: |

          mkdir -p files/etc/uci-defaults


          cat > files/etc/uci-defaults/98-argon-theme << 'EOF'
          #!/bin/sh

          if uci show luci >/dev/null 2>&1; then

            uci set luci.main.mediaurlbase='/luci-static/argon'

            uci commit luci

          fi

          exit 0
          EOF


          chmod +x \
            files/etc/uci-defaults/98-argon-theme


      # ==========================================================
      # 15. 生成最终配置
      # ==========================================================

      - name: Generate final config
        working-directory: lede
        run: |

          make defconfig


      # ==========================================================
      # 16. 验证 Target
      # ==========================================================

      - name: Verify final target
        working-directory: lede
        run: |

          echo
          echo "=========================================="
          echo "FINAL TARGET CONFIG"
          echo "=========================================="

          grep "^CONFIG_TARGET" .config || true

          echo
          echo "=========================================="
          echo "NOKIA DEVICE CONFIG"
          echo "=========================================="

          if [ "${{ inputs.device }}" = "mf" ]; then

            grep \
              "nokia_xg-040g-mf-ubi" \
              .config || true

          fi


          if [ "${{ inputs.device }}" = "md" ]; then

            grep \
              "nokia_xg-040g-md-ubi" \
              .config || true

          fi


      # ==========================================================
      # 17. 下载源码
      # ==========================================================

      - name: Download package sources
        working-directory: lede
        run: |

          make download \
            -j$(nproc) \
            V=s


      # ==========================================================
      # 18. 编译
      # ==========================================================

      - name: Build firmware
        working-directory: lede
        run: |

          echo "=========================================="
          echo "START BUILD"
          echo "=========================================="

          make \
            -j$(nproc) \
            V=s


      # ==========================================================
      # 19. 查找固件
      # ==========================================================

      - name: Find firmware
        working-directory: lede
        run: |

          echo
          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          find bin/targets \
            -type f \
            -maxdepth 5 \
            -printf "%p\n" \
            | sort


      # ==========================================================
      # 20. 整理输出
      # ==========================================================

      - name: Prepare release files
        working-directory: lede
        run: |

          rm -rf release

          mkdir -p release


          #
          # Copy all firmware artifacts
          #

          find bin/targets \
            -type f \
            \( \
              -name "*.itb" \
              -o -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.ubi" \
              -o -name "*.tar" \
              -o -name "*.gz" \
              \) \
            -exec cp {} release/ \;


          #
          # Copy config
          #

          cp .config \
            release/config.buildinfo


          #
          # Device information
          #

          echo "Nokia XG-040G-${{ inputs.device }} UBI" \
            > release/device.txt


          echo "${{ inputs.hostname }}" \
            > release/hostname.txt


          echo "${{ inputs.lan_ip }}" \
            > release/lan-ip.txt


          #
          # SHA256
          #

          cd release

          sha256sum * \
            > sha256sums.txt


          echo
          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="

          ls -lah


      # ==========================================================
      # 21. 上传 GitHub Artifact
      # ==========================================================

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:

          name: Nokia-XG-040G-${{ inputs.device }}-UBI

          path: lede/release/

          retention-days: 30


      # ==========================================================
      # 22. 生成 Release Tag
      # ==========================================================

      - name: Generate release tag
        if: inputs.upload_release == true
        id: release
        run: |

          TAG="nokia-xg040g-${{ inputs.device }}-ubi-$(date +'%Y%m%d-%H%M%S')"

          echo "tag=${TAG}" \
            >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 23. 创建 GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:

          tag_name: ${{ steps.release.outputs.tag }}

          name: Nokia XG-040G-${{ inputs.device }} UBI

          body: |

            # Nokia XG-040G-${{ inputs.device }} UBI

            ## Build information

            - Device: Nokia XG-040G-${{ inputs.device }}
            - Variant: UBI
            - Hostname: ${{ inputs.hostname }}
            - LAN IP: ${{ inputs.lan_ip }}

            ## Packages

            - Argon: ${{ inputs.argon }}
            - PassWall: ${{ inputs.passwall }}
            - Xray: ${{ inputs.xray }}
            - sing-box: ${{ inputs.singbox }}
            - OpenClash: ${{ inputs.openclash }}
            - Mihomo: ${{ inputs.mihomo }}
            - Lucky: ${{ inputs.lucky }}
            - File manager: ${{ inputs.filemanager }}
            - USB: ${{ inputs.usb }}
            - WireGuard: ${{ inputs.wireguard }}
            - OpenVPN: ${{ inputs.openvpn }}

            ## Important

            This firmware is built automatically by GitHub Actions.

            Please verify the device model and image type before flashing.

          files: |
            lede/release/*
